<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ໂປຣໄຟລ໌ສ່ວນຕົວ - ພັນມຸລາ ໄຊມຸນຄຳ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Phetsarath OT', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 20px;
        }
        .profile-img-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #4a90e2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        p.title {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-portfolio {
            background-color: #4a90e2;
            color: white;
        }
        .btn-portfolio:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
        .btn-bio {
            background-color: #2ecc71;
            color: white;
        }
        .btn-bio:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!--  الجزءຂອງຮູບໂປຣໄຟລ໌ -->
        <div class="profile-img-container">
            <!-- ໃຊ້ລິ້ງຮູບພາບຈາກ GitHub ໂດຍກົງ -->
            <img src="340068828_129045123361679_9175517816426128513_n.jpg" alt="ຮູບໂປຣໄຟລ໌">
        </div>

        <!-- ຊື່ ແລະ ຕຳແໜ່ງ -->
        <h1>ພັນມຸລາ ໄຊມຸນຄຳ</h1>
        <p class="title">ຍິນດີຕ້ອນຮັບສູ່ເວັບໄຊສ່ວນຕົວ</p>

        <!-- ປຸ່ມກົດໄປໜ້າຕ່າງໆ -->
        <div class="btn-container">
            <a href="portfolio.html" class="btn btn-portfolio">📁 ເຂົ້າເບິ່ງຜົນງານ</a>
            <a href="bio.html" class="btn btn-bio">👤 ປະຫວັດຫຍໍ້</a>
        </div>

        <footer>
            <p>© 2026 ພັດທະນາດ້ວຍ GitHub Pages</p>
        </footer>
    </div>

</body>
</html>
